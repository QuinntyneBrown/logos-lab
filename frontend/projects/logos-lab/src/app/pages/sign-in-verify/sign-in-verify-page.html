<ll-auth-card>
  <div slot="intro">
    <p class="eyebrow" i18n="@@signInVerify.eyebrow">Two-step verification</p>
    <h1 class="auth__title" i18n="@@signInVerify.title">Enter your verification code</h1>
    <p class="auth__sub" i18n="@@signInVerify.sub">
      Open your authenticator app and enter the 6-digit code it shows for Logos Lab.
    </p>
  </div>
  <form llForm (submit)="$event.preventDefault(); submit()">
    @if (errors().length) {
      <ll-form-summary
        heading="One thing to fix before you can sign in"
        i18n-heading="@@signInVerify.summary"
        [errors]="errors()"
      />
    }
    <ll-form-field
      label="6-digit code"
      i18n-label="@@signInVerify.code"
      controlId="code"
      help="Codes change every 30 seconds."
      i18n-help="@@signInVerify.codeHelp"
      helpPlacement="before"
      [error]="fieldError()"
    >
      <input
        llInput
        otp
        id="code"
        name="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        pattern="[0-9]{6}"
        required
        (input)="code.set($any($event.target).value)"
      />
    </ll-form-field>
    <button llButton variant="primary" size="lg" block type="submit" [busy]="busy()">
      @if (busy()) {
        <ng-container i18n="@@signInVerify.verifying">Verifying…</ng-container>
      } @else {
        <ng-container i18n="@@signInVerify.verify">Verify</ng-container>
      }
    </button>
  </form>
  <ng-container ngProjectAs="[slot=alt]">
    <p class="auth__alt">
      <a
        routerLink="."
        [queryParams]="{ method: 'recovery' }"
        queryParamsHandling="merge"
        i18n="@@signInVerify.useRecovery"
        >Lost your phone? Use a recovery code</a
      >
    </p>
    <p class="auth__alt">
      <ng-container i18n="@@signInVerify.notYou">Not you?</ng-container>&ngsp;
      <a routerLink="/sign-in" i18n="@@signInVerify.differentAccount"
        >Sign in with a different account</a
      >
    </p>
  </ng-container>
</ll-auth-card>
