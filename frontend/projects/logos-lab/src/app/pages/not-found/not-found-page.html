<div class="wrap">
  <ll-error-page code="404">
    <span slot="title" i18n="@@notFound.title">We can't find that page</span>
    <span slot="text" i18n="@@notFound.text"
      >The link may be old, or the page may have moved. Search Logos Lab, or start again from the
      catalogue.</span
    >
    <form
      llSearch
      inputId="nf-search"
      label="Search courses, videos, articles and experts"
      i18n-label="@@search.label"
      placeholder="Try “personhood” or “Augustine”"
      i18n-placeholder="@@search.placeholder"
      (searched)="searchNavigation.search($event)"
    >
      <button llButton variant="primary" type="submit" i18n="@@search.action">Search</button>
    </form>
    <a llButton variant="quiet" slot="actions" routerLink="/" i18n="@@notFound.home"
      >Go to the home page</a
    >
    <a llButton variant="quiet" slot="actions" routerLink="/explore" i18n="@@notFound.catalogue"
      >Browse the catalogue</a
    >
  </ll-error-page>
</div>
