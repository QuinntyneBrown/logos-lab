<ll-auth-card>
  <div slot="intro">
    <p class="eyebrow" i18n="@@forgotPassword.eyebrow">Forgot password</p>
    <h1 class="auth__title" i18n="@@forgotPassword.title">Reset your password</h1>
    <p class="auth__sub" i18n="@@forgotPassword.sub">
      Enter the email you use for Logos Lab and we'll send you a link to choose a new password.
    </p>
  </div>
  <form llForm (submit)="$event.preventDefault(); submit()">
    <ll-form-field
      label="Email"
      i18n-label="@@forgotPassword.email"
      controlId="email"
      help="The link works for 60 minutes."
      i18n-help="@@forgotPassword.emailHelp"
      helpPlacement="before"
    >
      <input
        llInput
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        required
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </ll-form-field>
    <button llButton variant="primary" size="lg" block type="submit" i18n="@@forgotPassword.send">
      Send reset link
    </button>
  </form>
  <p class="auth__alt" slot="alt">
    <ng-container i18n="@@forgotPassword.remembered">Remembered it?</ng-container>&ngsp;
    <a routerLink="/sign-in" i18n="@@forgotPassword.signIn">Sign in</a>
  </p>
</ll-auth-card>
