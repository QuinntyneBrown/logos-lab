<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="11" cy="11" r="6.5" />
  <path d="m20 20-4.2-4.2" />
</svg>
<label class="vh" [for]="inputId()">{{ label() }}</label>
<input
  #query
  class="search__input"
  type="search"
  autocomplete="off"
  [id]="inputId()"
  [name]="name()"
  [placeholder]="placeholder()"
  [value]="value()"
  [attr.aria-invalid]="invalid() || null"
  [attr.aria-describedby]="describedBy()"
  [attr.maxlength]="maxlength()"
  [attr.role]="listboxId() ? 'combobox' : null"
  [attr.aria-autocomplete]="listboxId() ? 'list' : null"
  [attr.aria-controls]="listboxId()"
  [attr.aria-expanded]="listboxId() ? expanded() : null"
  [attr.aria-activedescendant]="listboxId() ? activeDescendant() : null"
  (input)="queryChanged.emit(query.value)"
  (keydown)="queryKeydown.emit($event)"
/>
<ng-content />
