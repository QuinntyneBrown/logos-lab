<div
  class="photo-edit"
  [attr.role]="labelledBy() ? 'group' : null"
  [attr.aria-labelledby]="labelledBy()"
>
  @if (photoUrl(); as photoUrl) {
    <img class="photo-edit__img" [src]="photoUrl" width="96" height="96" [alt]="alt()" />
  } @else {
    <span class="photo-edit__img photo-edit__initials tile--{{ tone() }}" aria-hidden="true">{{
      initials()
    }}</span>
  }
  <div class="photo-edit__text"><ng-content /></div>
</div>
