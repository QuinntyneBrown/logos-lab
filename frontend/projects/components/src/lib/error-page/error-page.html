<div class="error-page">
  @if (code(); as code) {
    <p class="error-page__code" aria-hidden="true">{{ code }}</p>
  } @else {
    <ng-content select="[slot=icon]" />
  }
  <h1 class="error-page__title" tabindex="-1"><ng-content select="[slot=title]" /></h1>
  <p class="error-page__text"><ng-content select="[slot=text]" /></p>
  <ng-content />
  <div class="error-page__actions"><ng-content select="[slot=actions]" /></div>
  <ng-content select="[slot=after]" />
</div>
