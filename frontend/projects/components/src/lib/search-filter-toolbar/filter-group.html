<legend class="filter__legend">{{ label() }}</legend>
<ul class="filter__list">
  <ng-content select="li[llFilterOption]" />
</ul>
@if (canExpand()) {
  <button
    llButton
    variant="text"
    size="sm"
    type="button"
    class="filter__more"
    aria-expanded="false"
    (click)="expand()"
  >
    {{ moreLabel() }}
  </button>
}
<ng-content />
