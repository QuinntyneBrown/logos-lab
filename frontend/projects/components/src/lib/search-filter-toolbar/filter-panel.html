<aside class="filters" [attr.aria-labelledby]="titleId">
  <div class="filters__head">
    <h2 class="filters__title" [id]="titleId">{{ heading() }}</h2>
    @if (canClear()) {
      <button llButton variant="text" size="sm" type="button" (click)="cleared.emit()">
        {{ clearLabel() }}
      </button>
    }
  </div>
  <ng-content />
</aside>
