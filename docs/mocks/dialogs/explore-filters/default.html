<main id="main">

      </header>
      <div class="dialog__body">
        <div class="cluster cluster--between">
          <p id="dialog-desc" class="field__help">Choose as many as you like. The count updates as you go.</p>
          
        </div>
        <fieldset class="filter">
          <legend class="filter__legend">Type</legend>
          <ul class="filter__list"><li><label class="check"><input class="check__box" type="checkbox" name="type"><span>Course</span><span class="check__count">24</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="type"><span>Module</span><span class="check__count">11</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="type"><span>Video</span><span class="check__count">86</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="type"><span>Article</span><span class="check__count">64</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="type"><span>Collection</span><span class="check__count">18</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="type"><span>Event</span><span class="check__count">9</span></label></li></ul>
        </fieldset>
        <fieldset class="filter">
          <legend class="filter__legend">Topic</legend>
          <ul class="filter__list"><li><label class="check"><input class="check__box" type="checkbox" name="topic"><span>Theology of technology</span><span class="check__count">41</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="topic"><span>AI ethics</span><span class="check__count">37</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="topic"><span>Church and ministry</span><span class="check__count">33</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="topic"><span>The image of God and personhood</span><span class="check__count">28</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="topic"><span>Formation and education</span><span class="check__count">22</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="topic"><span>Work and vocation</span><span class="check__count">19</span></label></li></ul>
          <button type="button" class="btn btn--text btn--sm filter__more" aria-expanded="false">Show all 12 topics</button>
        </fieldset>
        <fieldset class="filter">
          <legend class="filter__legend">Level</legend>
          <ul class="filter__list"><li><label class="check"><input class="check__box" type="checkbox" name="level"><span>Introductory</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="level"><span>Intermediate</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="level"><span>Advanced</span></label></li></ul>
        </fieldset>
        <fieldset class="filter">

          <ul class="filter__list"><li><label class="check"><input class="check__box" type="checkbox" name="contributor"><span>Logos Lab</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="contributor"><span>Dr. Abena Mensah</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="contributor"><span>Rev. Dr. Thomas Hale</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="contributor"><span>Dr. Joel Santos</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="contributor"><span>Dr. Lucía Ortega</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="contributor"><span>Prof. Simon Keller</span></label></li></ul>

        <fieldset class="filter">
          <legend class="filter__legend">Length</legend>
          <ul class="filter__list"><li><label class="check"><input class="check__box" type="checkbox" name="length"><span>Under 15 min</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="length"><span>15 to 60 min</span></label></li><li><label class="check"><input class="check__box" type="checkbox" name="length"><span>Over 60 min</span></label></li></ul>
        </fieldset>
      </div>
      <footer class="dialog__footer">
        <a class="btn btn--quiet" href="../../pages/explore/default.html">Cancel</a>
