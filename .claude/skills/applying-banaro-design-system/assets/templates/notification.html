<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Notification}} · {{state}} — {{App}}</title>
<!-- Template: a toast (or banner) shown on the page that triggers it. Copy to docs/mocks/notifications/<id>/<state>.html.
     States are tones (info, success, warning, danger) plus with-action / stacked / persistent. -->
<meta name="mock:kind" content="notification">
<meta name="mock:screen" content="{{notification-id}}">
<meta name="mock:state" content="{{state}}">
<meta name="mock:requirements" content="{{L2-IDs separated by spaces}}">
<meta name="description" content="{{One sentence: what happened and where it shows.}}">
<link rel="stylesheet" href="../../assets/tokens.css">
<link rel="stylesheet" href="../../assets/ui.css">
<link rel="stylesheet" href="../../assets/mock.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="header"><div class="wrap header__inner"><a class="brand" href="../../pages/{{home-screen}}/default.html" aria-label="{{App}} home"><!-- kit placeholder mark: replace with the app mark from src/components/brand.md --><svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7.5 24.5C7.5 14 14 7.5 25 7.5c0 11-6.5 17-17.5 17zM7.5 24.5l9.5-9.5M7.5 24.5 5 27" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand__sun" cx="8.5" cy="8.5" r="2.4"/></svg><span>{{app}}</span></a></div></header>
<main id="main">
  <div class="wrap">
    <div class="page-head"><h1 class="page-head__title">{{The page the notification appears on}}</h1></div>
  </div>
</main>

<div class="toast-region" aria-live="polite">
  <div class="toast toast--success" role="status">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>
    <p class="toast__title">{{What changed}}</p>
    <p class="toast__body">{{One calm, specific sentence.}}</p>
    <button type="button" class="btn btn--text btn--sm toast__action">Undo</button>
    <button type="button" class="icon-btn toast__close" aria-label="Dismiss"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>

<nav class="mock-bar" aria-label="Mock navigation">
  <a class="mock-bar__home" href="../../index.html" aria-label="All mocks">⌂</a>
  <span class="mock-bar__screen">{{Notification}}</span>
  <ul class="mock-bar__states">
    <li><a href="info.html">info</a></li>
    <li><a href="success.html" aria-current="page">success</a></li>
    <li><a href="warning.html">warning</a></li>
    <li><a href="danger.html">danger</a></li>
  </ul>
  <button type="button" data-theme-toggle aria-pressed="false">☾ Dark</button>
  <button type="button" data-chrome-toggle aria-label="Hide mock chrome">×</button>
</nav>
<script src="../../assets/mock.js"></script>
</body>
</html>
